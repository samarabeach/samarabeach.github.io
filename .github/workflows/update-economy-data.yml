# Refreshes data/economy.json for the Economic Chart Portfolio every Saturday,
# and whenever it's started by hand (Actions tab → Update economy data → Run workflow).
# FRED's public CSV download needs no API key, so no secrets are involved.
name: Update economy data

on:
  schedule:
    - cron: "17 14 * * 6" # Saturdays, 14:17 UTC (morning in Washington)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-economy-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull from FRED
        run: python3 scripts/update_economy_data.py

      - name: Commit the new data
        run: |
          if git diff --quiet -- data/; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update economy data from FRED"
          git push
